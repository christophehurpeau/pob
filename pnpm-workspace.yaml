allowBuilds:
  esbuild: true
  unrs-resolver: true
dedupePeerDependents: true
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - "@pob/*"
  - pob-dependencies
  - check-package-dependencies
  - alouette
  - alouette-icons
  - nightingale
  - nightingale-logger
  # Renovate security update: js-yaml@5.4.1
  - js-yaml@5.4.1
  # Renovate security update: vitest@4.1.11
  - vitest@4.1.11
  # fixes a storage cache regression of 10.0.0
  - yeoman-generator@10.0.1
nodeLinker: hoisted
packages:
  - packages/*
  - "@pob/*"
  - pob-examples/*
savePrefix: ^
